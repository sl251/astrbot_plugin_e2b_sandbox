<!doctype html>
<html lang="zh-CN" data-theme-mode="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' http: https:; style-src 'self' http: https: 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>E2B 云沙箱控制台</title>
  <link rel="stylesheet" href="./panel.css">
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script src="./bridge-client.js" defer></script>
  <script src="./panel.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#sessions-section">跳到实例列表</a>

  <main class="shell">
    <!-- 顶部极简标题与控制栏 -->
    <header class="page-header">
      <div class="header-main">
        <div class="title-row">
          <h1>E2B 云沙箱</h1>
          <span class="chip chip--primary mono" id="plugin-version">v—</span>
          <span class="chip chip--neutral" id="scope-badge" title="群聊沙箱隔离模式">群聊共享</span>
        </div>
        <div class="header-meta">
          <span>运行 <strong class="mono" id="plugin-uptime">—</strong></span>
          <span class="meta-sep" aria-hidden="true">·</span>
          <span>同步 <span class="mono" id="last-updated">—</span></span>
        </div>
      </div>

      <div class="header-actions">
        <label class="sync-pill" id="poll-pill" for="auto-refresh" title="每 10 秒同步本地追踪快照">
          <input id="auto-refresh" type="checkbox" checked>
          <span class="sync-dot" aria-hidden="true"></span>
          <span id="poll-state">连接中</span>
        </label>

        <button class="btn btn--text" id="theme-toggle" type="button" aria-label="切换主题模式" title="切换主题：跟随宿主 / 浅色 / 深色">
          <svg class="theme-icon theme-icon--auto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M8 21h8M12 17v4"/>
          </svg>
          <svg class="theme-icon theme-icon--light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg class="theme-icon theme-icon--dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span id="theme-label">跟随宿主</span>
        </button>

        <button class="btn btn--tonal" id="refresh-button" type="button" disabled>
          <svg class="refresh-icon" id="refresh-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <path d="M21 3v6h-6"/>
          </svg>
          <span id="refresh-label">刷新</span>
        </button>
      </div>
    </header>

    <!-- 仅在异常或连接失败时展示的错误横幅 -->
    <div id="notice-bar" class="alert-banner" role="alert" aria-live="polite" hidden>
      <div class="alert-main">
        <span class="alert-dot" aria-hidden="true"></span>
        <p id="notice" class="alert-text">正在连接宿主…</p>
      </div>
      <button id="retry-button" class="btn btn--sm btn--text-danger" type="button" hidden>重试</button>
    </div>

    <noscript>
      <div class="alert-banner alert-banner--error">
        <p class="alert-text">需要启用 JavaScript 才能使用此控制台。</p>
      </div>
    </noscript>

    <!-- 4 张等宽核心状态概览卡 -->
    <section class="overview-grid" aria-label="核心概览">
      <button class="overview-card overview-card--interactive" id="kpi-running-card" type="button" title="筛选运行中的实例">
        <div class="overview-head">
          <span class="overview-icon overview-icon--running" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="6 3 20 12 6 21 6 3"/>
            </svg>
          </span>
          <span class="chip chip--running">计费中</span>
        </div>
        <div class="overview-body">
          <span class="overview-label">运行中</span>
          <strong class="overview-value mono" id="count-running">—</strong>
          <span class="overview-note" id="running-sub">占用运行槽位</span>
        </div>
      </button>

      <button class="overview-card overview-card--interactive" id="kpi-paused-card" type="button" title="筛选已休眠的实例">
        <div class="overview-head">
          <span class="overview-icon overview-icon--paused" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="4" width="4" height="16" rx="1"/>
              <rect x="14" y="4" width="4" height="16" rx="1"/>
            </svg>
          </span>
          <span class="chip chip--paused">零计费</span>
        </div>
        <div class="overview-body">
          <span class="overview-label">已休眠</span>
          <strong class="overview-value mono" id="count-paused">—</strong>
          <span class="overview-note" id="paused-sub">保留状态</span>
        </div>
      </button>

      <article class="overview-card">
        <div class="overview-head">
          <span class="overview-icon overview-icon--primary" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="7" rx="2"/>
              <rect x="2" y="14" width="20" height="7" rx="2"/>
              <line x1="6" y1="6.5" x2="6.01" y2="6.5"/>
              <line x1="6" y1="17.5" x2="6.01" y2="17.5"/>
            </svg>
          </span>
          <span class="overview-percent mono" id="capacity-percent">—</span>
        </div>
        <div class="overview-body">
          <span class="overview-label">运行槽位</span>
          <div class="overview-ratio">
            <strong class="overview-value mono" id="capacity-used">—</strong>
            <span class="overview-denom mono">/ <span id="capacity-limit">—</span></span>
          </div>
          <div class="slot-matrix" id="slot-matrix" aria-hidden="true"></div>
          <progress id="capacity-progress" class="sr-only" value="0" max="1" aria-label="运行槽位占用"></progress>
          <span class="overview-note mono" id="capacity-brief">空闲 — · 排队 <span id="capacity-waiting">—</span></span>
        </div>
      </article>

      <button class="overview-card overview-card--interactive" id="kpi-keys-card" type="button" title="查看 API Key 轮询池与配额">
        <div class="overview-head">
          <span class="overview-icon overview-icon--primary" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="7.5" cy="15.5" r="4.5"/>
              <path d="M10.7 12.3L21 2"/>
              <path d="M17 6l3 3"/>
            </svg>
          </span>
          <span class="chip chip--neutral" id="kpi-keys-status">—</span>
        </div>
        <div class="overview-body">
          <span class="overview-label">API Key 池</span>
          <div class="overview-ratio">
            <strong class="overview-value mono" id="kpi-keys-available">—</strong>
            <span class="overview-denom mono">/ <span id="kpi-keys-total">—</span></span>
          </div>
          <span class="overview-note">查看轮询与配额 →</span>
        </div>
      </button>
    </section>

    <!-- 官方 DataPage 风格分段导航栏 -->
    <div class="workspace-bar">
      <div class="tabs-scroll">
        <div class="tabs-list" role="tablist" aria-label="控制台视图">
          <button class="tab-btn" id="tab-sessions" type="button" role="tab" aria-selected="true" tabindex="0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
            <span>云沙箱实例</span>
            <span class="tab-count mono" id="count-total">—</span>
          </button>

          <button class="tab-btn" id="tab-keys" type="button" role="tab" aria-selected="false" tabindex="-1">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <span>Key 池与配额</span>
            <span class="tab-alert-dot" id="tab-keys-dot" hidden aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div class="view-switcher" id="view-switch-wrap" role="group" aria-label="展示视图">
        <button class="view-btn is-active" id="view-table-btn" type="button" aria-pressed="true" title="表格视图">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M3 10h18M3 15h18"/>
          </svg>
          <span>表格</span>
        </button>
        <button class="view-btn" id="view-card-btn" type="button" aria-pressed="false" title="卡片视图">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="8" height="8" rx="1.5"/>
            <rect x="13" y="3" width="8" height="8" rx="1.5"/>
            <rect x="3" y="13" width="8" height="8" rx="1.5"/>
            <rect x="13" y="13" width="8" height="8" rx="1.5"/>
          </svg>
          <span>卡片</span>
        </button>
      </div>
    </div>

    <!-- Tab 1：云沙箱实例（全宽） -->
    <div id="tabpanel-sessions" role="tabpanel" aria-labelledby="tab-sessions">
      <section class="surface-card sessions-card" id="sessions-section" aria-label="云沙箱实例列表" tabindex="-1">
        <div class="card-toolbar">
          <div class="toolbar-top">
            <label class="search-field" for="session-search">
              <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
              </svg>
              <input id="session-search" type="search" placeholder="搜索群号、用户、渠道、Key 或沙箱 ID…" maxlength="240" autocomplete="off" aria-label="搜索云沙箱实例">
            </label>

            <div class="toolbar-selects">
              <select id="status-filter" class="sr-only" aria-label="按状态筛选">
                <option value="all">全部</option>
                <option value="running">运行中</option>
                <option value="paused">已休眠</option>
                <option value="starting">唤醒中</option>
                <option value="unknown">待确认</option>
                <option value="pending">启动 / 待确认</option>
                <option value="busy">执行中</option>
              </select>

              <select id="session-sort" class="select" aria-label="排序方式">
                <option value="last_active_desc">最近活跃</option>
                <option value="last_active_asc">最早活跃</option>
                <option value="created_at_desc">最新创建</option>
                <option value="created_at_asc">最早创建</option>
              </select>

              <select id="page-size" class="select" aria-label="每页数量">
                <option value="10">10 / 页</option>
                <option value="20" selected>20 / 页</option>
                <option value="50">50 / 页</option>
              </select>
            </div>
          </div>

          <div class="filter-pills" id="status-pills" role="group" aria-label="快捷状态筛选">
            <button class="filter-pill is-active" type="button" data-filter="all" aria-pressed="true">全部 <span class="mono" id="pill-count-all">0</span></button>
            <button class="filter-pill" type="button" data-filter="running" aria-pressed="false">运行中 <span class="mono" id="pill-count-running">0</span></button>
            <button class="filter-pill" type="button" data-filter="paused" aria-pressed="false">已休眠 <span class="mono" id="pill-count-paused">0</span></button>
            <button class="filter-pill" type="button" data-filter="pending" aria-pressed="false">启动 / 待确认 <span class="mono" id="count-unknown">0</span></button>
            <button class="filter-pill" type="button" data-filter="busy" aria-pressed="false">执行中 <span class="mono" id="pill-count-busy">0</span></button>
          </div>
        </div>

        <div id="sessions-region" class="sessions-region" data-view="table" aria-busy="true">
          <div class="table-wrap" id="table-wrap" tabindex="0" role="region" aria-label="云沙箱实例表">
            <table class="session-table">
              <thead>
                <tr>
                  <th scope="col" class="col-identity">来源 / 沙箱 ID</th>
                  <th scope="col" class="col-status">状态</th>
                  <th scope="col" class="col-key">Key / 环境</th>
                  <th scope="col" class="col-time">活跃与寿命</th>
                  <th scope="col" class="col-files">文件</th>
                  <th scope="col" class="col-actions">操作</th>
                </tr>
              </thead>
              <tbody id="session-list"></tbody>
            </table>
          </div>

          <div id="session-empty" class="empty-state" hidden>
            <span class="empty-icon" aria-hidden="true">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <path d="M8 21h8M12 17v4"/>
              </svg>
            </span>
            <p class="empty-title" id="empty-title">暂无云沙箱实例</p>
            <button id="reset-filters" class="btn btn--sm btn--tonal" type="button" hidden>重置筛选</button>
          </div>
        </div>

        <nav class="pagination" aria-label="分页">
          <span class="page-summary mono" id="session-summary">共 — 台</span>
          <div class="page-controls">
            <span class="page-range mono" id="page-summary"></span>
            <button class="btn btn--sm btn--text" id="previous-page" type="button" disabled>上一页</button>
            <span class="page-label mono" id="page-label">1 / 1</span>
            <button class="btn btn--sm btn--text" id="next-page" type="button" disabled>下一页</button>
          </div>
        </nav>
      </section>
    </div>

    <!-- Tab 2：API Key 池与运行配额 -->
    <div id="tabpanel-keys" role="tabpanel" aria-labelledby="tab-keys" hidden>
      <div class="split-grid">
        <section class="surface-card panel-padded" aria-labelledby="keys-heading">
          <div class="section-head">
            <h2 id="keys-heading">API Key 轮询池</h2>
            <span class="chip chip--primary mono" id="key-count">—</span>
          </div>
          <div id="key-list" class="key-list">
            <p class="muted small">加载中…</p>
          </div>
        </section>

        <section class="surface-card panel-padded" aria-labelledby="capacity-heading">
          <div class="section-head">
            <h2 id="capacity-heading">运行配额</h2>
            <span id="capacity-pending" class="chip chip--paused" hidden>上限待同步</span>
          </div>

          <div class="policy-groups">
            <div class="policy-group">
              <h3 class="policy-title">并发与排队</h3>
              <dl class="policy-list">
                <div class="policy-row"><dt>同时运行上限</dt><dd class="mono" id="capacity-limit-detail">—</dd></div>
                <div class="policy-row"><dt>当前占用</dt><dd class="mono" id="capacity-occupied-detail">—</dd></div>
                <div class="policy-row"><dt>剩余可用</dt><dd class="mono" id="capacity-free">—</dd></div>
                <div class="policy-row"><dt>当前排队 / 队列容量</dt><dd class="mono" id="capacity-queue">—</dd></div>
                <div class="policy-row"><dt>排队最长等待</dt><dd class="mono" id="capacity-timeout">—</dd></div>
              </dl>
            </div>

            <div class="policy-group">
              <h3 class="policy-title">休眠与回收</h3>
              <dl class="policy-list">
                <div class="policy-row"><dt>空闲自动休眠</dt><dd class="mono" id="policy-idle-pause">—</dd></div>
                <div class="policy-row"><dt>休眠最长保留</dt><dd class="mono" id="policy-paused-retention">—</dd></div>
              </dl>
            </div>

            <div class="policy-group">
              <h3 class="policy-title">文件上限</h3>
              <dl class="policy-list">
                <div class="policy-row"><dt>单附件上传</dt><dd class="mono" id="policy-upload-limit">—</dd></div>
                <div class="policy-row"><dt>单产物回传</dt><dd class="mono" id="policy-return-limit">—</dd></div>
              </dl>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- 原生模态确认对话框（不加冗余 role/aria-modal；AstrBot 28px 大圆角与胶囊操作按钮） -->
  <dialog id="confirm-dialog" closedby="closerequest" aria-labelledby="confirm-title" aria-describedby="confirm-description">
    <div class="dialog-body">
      <div class="dialog-header">
        <h1 id="confirm-title">确认操作</h1>
      </div>
      <p id="confirm-description" class="dialog-desc"></p>

      <dl class="dialog-target">
        <div><dt>来源</dt><dd id="confirm-session"></dd></div>
        <div><dt>沙箱 ID</dt><dd class="mono" id="confirm-sandbox"></dd></div>
        <div><dt>绑定 Key</dt><dd id="confirm-key"></dd></div>
      </dl>

      <label class="dialog-check" id="pause-ack-label" for="pause-ack">
        <input id="pause-ack" type="checkbox">
        <span>确认休眠此云沙箱（停止计费并释放槽位）</span>
      </label>

      <div class="dialog-field" id="kill-input-label" hidden>
        <div class="dialog-field-head">
          <label for="kill-id">输入沙箱 ID 确认销毁</label>
          <button class="btn-inline" id="fill-kill-id" type="button">填入 ID</button>
        </div>
        <input id="kill-id" type="text" autocomplete="off" spellcheck="false" maxlength="256" placeholder="完整沙箱 ID">
        <span class="kill-match-hint mono" id="kill-match-hint"></span>
      </div>

      <p id="action-feedback" class="dialog-feedback" role="status" aria-live="polite"></p>

      <div class="dialog-actions">
        <button id="cancel-action" class="btn btn--text btn--pill" type="button">取消</button>
        <button id="confirm-action" class="btn btn--flat btn--pill" type="button" disabled>确认</button>
      </div>
    </div>
  </dialog>

  <!-- AstrBot v-snackbar 风格轻提示区域 -->
  <div class="toast-region" role="region" aria-label="操作提示">
    <div id="toast" class="toast" hidden>
      <span id="toast-text" role="status" aria-live="polite"></span>
      <button id="toast-close" class="toast-close" type="button" aria-label="关闭提示">×</button>
    </div>
  </div>

  <!-- 纯内联 SVG 图标模板（零外链） -->
  <template id="tpl-icon-group">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
  </template>
  <template id="tpl-icon-user">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
  </template>
  <template id="tpl-icon-copy">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="9" width="13" height="13" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
  </template>
  <template id="tpl-icon-key">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="7.5" cy="15.5" r="4.5"/>
      <path d="M10.7 12.3L21 2"/>
      <path d="M17 6l3 3"/>
    </svg>
  </template>
</body>
</html>
