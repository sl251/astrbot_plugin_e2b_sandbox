name: Lifecycle regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        sdk: [minimum, current]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install minimum supported SDK
        if: matrix.sdk == 'minimum'
        run: python -m pip install 'e2b-code-interpreter==2.3.0' 'e2b==2.6.0'
      - name: Install current SDK
        if: matrix.sdk == 'current'
        run: python -m pip install -r requirements.txt
      - name: Run lifecycle, capacity and SDK compatibility tests
        run: python -m unittest discover -s tests -v
